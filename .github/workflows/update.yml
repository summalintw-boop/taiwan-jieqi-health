# 每天臺灣時間 06:10 與 14:10 更新資料並發布到 GitHub Pages
# 網站檔案放在 repository 的 jieqi_health_web/ 資料夾
# 資安：各 Action 固定在特定提交（註解為對應版本），避免上游標籤被改動時執行到非預期的程式；升級時請一併更新提交碼
name: update-and-deploy

on:
  schedule:
    - cron: "10 22 * * *"   # UTC 22:10 = 臺灣 06:10（這一次會送 LINE 推播）
    - cron: "10 6 * * *"    # UTC 06:10 = 臺灣 14:10
  workflow_dispatch:
    inputs:
      send_line:
        description: "手動執行時也送 LINE 推播（需先設定 LINE_CHANNEL_ACCESS_TOKEN）"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: jieqi_health_web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: 更新資料
        run: python update_data.py --only ncdr,climate,temp   # 疾管署由臺灣的電腦每週補抓（local_cdc_update.ps1）；同時產生 site/today.json
      - name: LINE 每日推播
        # 只在早上 06:10 那次排程（或手動勾選 send_line）執行；沒有設定 token 時只印出訊息、不推播
        if: github.event.schedule == '10 22 * * *' || inputs.send_line
        continue-on-error: true
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          LINE_MODE: ${{ vars.LINE_MODE }}
          LINE_REGION: ${{ vars.LINE_REGION }}
        run: python line_daily.py --send --no-write
      - name: 保存資料快照
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add site/data.json site/index.html site/today.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || true
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: jieqi_health_web/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
